name: 🚀 Deploy Colombian Workdays API

on:
  push:
    branches:
      - master # Rama para automatizar el despliegue
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub Actions

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Configurar Node.js
      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Instalar dependencias
      - name: 📦 Install dependencies
        run: npm ci

      # 4️⃣ Compilar el proyecto
      - name: 🏗️ Build project
        run: npm run build

      # 5️⃣ Limpiar posibles ChangeSets pendientes en CloudFormation
      - name: 🧹 Clean old ChangeSets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.CDK_DEFAULT_REGION }}
        run: |
          echo "🧹 Checking for old ChangeSets in CloudFormation..."
          aws cloudformation list-change-sets --stack-name ColombianWorkdaysStack --query "Summaries[].ChangeSetName" --output text | while read CHANGESET; do
            if [ ! -z "$CHANGESET" ]; then
              echo "Deleting ChangeSet $CHANGESET"
              aws cloudformation delete-change-set --stack-name ColombianWorkdaysStack --change-set-name "$CHANGESET" || true
            fi
          done

      # 6️⃣ Instalar dependencias del CDK y desplegar
      - name: 🌩️ Deploy to AWS
        working-directory: deploy_aws
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.CDK_DEFAULT_REGION }}
          CDK_DEFAULT_REGION: ${{ secrets.CDK_DEFAULT_REGION }}
          CDK_ACCOUNT: ${{ secrets.CDK_ACCOUNT }}
        run: |
          npm ci
          npx cdk deploy --require-approval never || echo "⚠️ CDK finished with a non-critical warning"
